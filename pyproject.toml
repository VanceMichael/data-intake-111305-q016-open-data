[project]
name = "open-data"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["open_data", "open_data.fixtures"]

[tool.setuptools.package-dir]
"open_data.fixtures" = "fixtures"

[tool.setuptools.package-data]
"open_data.fixtures" = ["*.json"]
